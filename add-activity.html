<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Fitness Activity</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            💪 Fitness Tracker
        </div>


        <div class="nav-links">

            <a href="index.html">
                Dashboard
            </a>

            <a href="add-activity.html">
                Add Activity
            </a>

            <a href="progress.html">
                Progress
            </a>

            <a href="history.html">
                History
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

    </nav>



    <!-- =========================
         ADD ACTIVITY PAGE
    ========================== -->

    <main class="activity-container">

        <div class="activity-box">


            <h1>
                Add Fitness Activity
            </h1>


            <p class="form-description">
                Enter your fitness activity details below.
            </p>



            <!-- =========================
                 ACTIVITY FORM
            ========================== -->

            <form id="activityForm">


                <!-- DATE -->

                <div class="form-group">

                    <label for="activityDate">
                        Date
                    </label>


                    <input
                        type="date"
                        id="activityDate"
                        required
                    >

                </div>



                <!-- EXERCISE TYPE -->

                <div class="form-group">

                    <label for="exerciseType">
                        Exercise Type
                    </label>


                    <select
                        id="exerciseType"
                        required
                    >

                        <option value="">
                            Select Exercise
                        </option>


                        <option value="Walking">
                            Walking
                        </option>


                        <option value="Running">
                            Running
                        </option>


                        <option value="Cycling">
                            Cycling
                        </option>


                        <option value="Swimming">
                            Swimming
                        </option>


                        <option value="Gym">
                            Gym
                        </option>


                        <option value="Yoga">
                            Yoga
                        </option>


                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- WORKOUT DURATION -->

                <div class="form-group">

                    <label for="duration">
                        Workout Duration (minutes)
                    </label>


                    <input
                        type="number"
                        id="duration"
                        placeholder="Example: 45"
                        min="1"
                        required
                    >

                </div>



                <!-- BODY WEIGHT -->

                <div class="form-group">

                    <label for="weight">
                        Body Weight (kg)
                    </label>


                    <input
                        type="number"
                        id="weight"
                        placeholder="Example: 60"
                        min="1"
                        step="0.1"
                        required
                    >

                </div>



                <!-- CALORIES -->

                <div class="form-group">

                    <label for="calories">
                        Estimated Calories Burned (kcal)
                    </label>


                    <input
                        type="number"
                        id="calories"
                        placeholder="Calories will be calculated automatically"
                        min="0"
                        readonly
                    >

                    <small
                        id="calorieMessage"
                        style="
                            display: block;
                            margin-top: 6px;
                            color: #64748b;
                            font-size: 13px;
                        "
                    >
                        Select an exercise and enter duration and weight.
                    </small>

                </div>



                <!-- STEPS -->

                <div class="form-group">

                    <label for="steps">
                        Steps
                    </label>


                    <input
                        type="number"
                        id="steps"
                        placeholder="Example: 7850"
                        min="0"
                        value="0"
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 6px;
                            color: #64748b;
                            font-size: 13px;
                        "
                    >
                        Enter 0 for activities such as Yoga or Swimming if steps are not available.
                    </small>

                </div>



                <!-- WATER -->

                <div class="form-group">

                    <label for="water">
                        Water Intake (litres)
                    </label>


                    <input
                        type="number"
                        id="water"
                        placeholder="Example: 2.5"
                        min="0"
                        step="0.1"
                        required
                    >

                </div>



                <!-- NOTES -->

                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>


                    <textarea
                        id="notes"
                        placeholder="Example: Morning workout"
                        rows="4"
                    ></textarea>

                </div>



                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="save-button"
                    id="saveActivityBtn"
                >
                    Save Activity
                </button>



                <!-- MESSAGE -->

                <p id="activityMessage"></p>


            </form>


        </div>

    </main>



    <!-- =========================
         FIREBASE
    ========================== -->

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"
    ></script>


    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"
    ></script>


    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"
    ></script>


    <!-- Firebase Configuration -->

    <script src="js/firebase.js"></script>


    <!-- Activity JavaScript -->

    <script src="js/activity.js"></script>


</body>

</html>
